[package]
name = "rechenkern"
description = "Natural language calculator engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
insta = "1.48.0"
jiff = "0.2.37"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[dependencies]
dashu-int = { version = "0.6.2", default-features = false, features = ["std"] }
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
rust_decimal = "1.43.0"
serde_json = { version = "1.0.151", optional = true }
ureq = { version = "3.4.2", optional = true }

[features]
default = []
# Fetch exchange rates over HTTP with an on-disk cache.
online = ["dep:ureq", "dep:serde_json"]

[[bench]]
name = "calculate"
harness = false
